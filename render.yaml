services:
  # Backend API on Render Web Service
  - type: web
    name: cyberrange-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./cyberrange.db
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DETECTION_RULES_PATH
        value: ./detection-rules
      - key: SCENARIOS_PATH
        value: ./data/attack-scenarios
      - key: IOC_DB_PATH
        value: ./data/sample-iocs/ioc_reputation_db.json
